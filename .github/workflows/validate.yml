name: Validate extension artifacts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifests and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for package_dir in packages/native-faithful packages/personal-hardened; do
            jq -e '.manifest_version == 3 and .version == "2.2.0" and .background.service_worker == "background.js"' "$package_dir/manifest.json" >/dev/null
            test -f "$package_dir/background.js"
            test -f "$package_dir/options.html"
            test -f "$package_dir/popup.html"
          done
          find packages -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate release archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          unzip -tq openclaw-browser-extension-2.2.0-arc-dia.zip
          unzip -tq openclaw-browser-extension-2.2.0-hardened-arc-dia.zip
          sha256sum -c SHA256SUMS
